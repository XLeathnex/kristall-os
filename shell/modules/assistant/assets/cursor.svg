<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Kristall assistant cursor (GPL-3.0-or-later, drawn for Kristall OS). A cut crystal shard in
       the outline of a pointer: two facets that differ only in brightness, like the Kristall mark.
       Hotspot (the tip) at (12, 12). -->
  <defs>
    <radialGradient id="halo" cx="20" cy="21" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE9FF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#7C8CFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="12" y1="12" x2="20" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9FBFF"/>
      <stop offset="0.4" stop-color="#4FD3FF"/>
      <stop offset="1" stop-color="#3E63F5"/>
    </linearGradient>
    <linearGradient id="shade" x1="12" y1="12" x2="33" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B5ECFF"/>
      <stop offset="0.5" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#7448F0"/>
    </linearGradient>
  </defs>
  <circle cx="20" cy="21" r="18" fill="url(#halo)"/>
  <!-- outline for contrast on any background -->
  <path d="M12 12 L16.6 34.2 L21.6 26.6 L33.2 22.2 Z" fill="none" stroke="#0B1530" stroke-opacity="0.7" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M12 12 L16.6 34.2 L21.6 26.6 Z" fill="url(#lit)"/>
  <path d="M12 12 L21.6 26.6 L33.2 22.2 Z" fill="url(#shade)"/>
  <path d="M12 12 L21.6 26.6" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.8"/>
  <path d="M12 12 L16.6 34.2 L21.6 26.6 L33.2 22.2 Z" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
