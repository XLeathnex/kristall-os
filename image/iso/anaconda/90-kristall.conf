# Anaconda settings for the Kristall OS installer (loaded after the fedora-kinoite profile).
# The installer only asks for the language and the disk. The owner's account, keyboard, time
# zone and Wi-Fi are set up on first start by Plasma Setup, then the Kristall Setup Assistant.

[Bootloader]
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1

[User Interface]
# Qt-based runner for the Web UI (what Fedora's KDE live media use).
webui_web_engine = slitherer
hidden_spokes =
    NetworkSpoke
    PasswordSpoke
    UserSpoke
hidden_webui_pages =
    anaconda-screen-accounts
    anaconda-screen-date-time
    anaconda-screen-network

[Localization]
use_geolocation = False
