# Kristall OS (image component) runtime/state directories. World-readable on purpose:
# settings screens read the status files without privileges.
d /var/lib/kristall 0755 root root -
d /var/lib/kristall/update 0755 root root -
d /var/lib/kristall/apps 0755 root root -
d /run/kristall-update 0755 root root -
