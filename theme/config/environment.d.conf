# Kristall theme: our copy of Plasma's desktop shell package (lock screen and log-out dialog,
# theme.md §6) is found before the stock one. The directory holds only plasma/shells/.
XDG_DATA_DIRS=/usr/share/kristall/theme/overlay:${XDG_DATA_DIRS:-/usr/local/share/:/usr/share/}
# GTK 3 modules: kristall-reload (running GTK 3 apps follow the appearance switch) and
# unity-gtk-module (GTK 3 apps under XWayland export their menus to the Kristall menu bar,
# kwin/bridge README; inactive on native Wayland). A missing module is skipped by GTK with a warning.
GTK_MODULES=${GTK_MODULES:+$GTK_MODULES:}kristall-reload-gtk-module:unity-gtk-module
