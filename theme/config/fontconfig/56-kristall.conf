<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Kristall OS fonts: Inter for interfaces and the web's sans-serif, JetBrains Mono for code,
     Noto Color Emoji for emoji. Rendering for a high-density panel that may be OLED: greyscale
     antialiasing (OLED subpixels are not an RGB stripe, so subpixel rendering would fringe), no
     hinting (shapes stay true at fractional scales), no embedded bitmaps. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono</family><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <!-- Inter has its own tabular and stylistic features; keep contextual alternates on -->
  <match target="font">
    <test name="family"><string>Inter</string></test>
    <edit name="fontfeatures" mode="append"><string>calt on</string></edit>
  </match>
</fontconfig>
