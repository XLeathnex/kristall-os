# Kristall OS system-wide GTK defaults (/etc/gtk-3.0/settings.ini and /etc/gtk-4.0/settings.ini).
# Per-user values are kept in sync with Plasma by kde-gtk-config and kristall-appearance.
[Settings]
gtk-theme-name=adw-gtk3
gtk-icon-theme-name=breeze
gtk-cursor-theme-name=Kristall
gtk-cursor-theme-size=24
gtk-font-name=Inter 9.75
gtk-decoration-layout=close,minimize,maximize:
gtk-application-prefer-dark-theme=false
gtk-enable-animations=true
gtk-sound-theme-name=kristall
gtk-enable-event-sounds=true
gtk-primary-button-warps-slider=true
gtk-overlay-scrolling=true
gtk-hint-font-metrics=false
gtk-xft-antialias=1
gtk-xft-hinting=0
gtk-xft-hintstyle=hintnone
gtk-xft-rgba=none
