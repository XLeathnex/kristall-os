# Kristall login screen (plasma-login-manager 6.8): our wallpaper behind the greeter (blurred while
# the password field is shown); colours, font and pointer come from /etc/xdg (kdeglobals,
# kcminputrc), which the greeter user reads like every user.
[Greeter]
WallpaperPluginId=org.kde.image
ShowClock=true

[Greeter][Wallpaper][org.kde.image][General]
Image=/usr/share/wallpapers/Kristall/
