# Builds the installer ISO (a USB stick image) from the published Kristall OS image.
#   - automatically after the first successful image build, then at most once a week
#   - every Monday, so a fresh installer is always available (artifacts expire after 30 days)
#   - by hand: Actions → "Build installer ISO" → "Run workflow"
# The ISO is attached to the run as a single, unzipped file: "Kristall-OS-Installer.iso".
name: Build installer ISO

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  workflow_run:
    workflows: ["Build OS image"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: installer-iso
  cancel-in-progress: false

env:
  IMAGE_NAME: kristall-os
  ISO_NAME: Kristall-OS-Installer.iso

jobs:
  decide:
    name: Is a new installer needed?
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ $EVENT != workflow_run ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # After an image build: only if no installer younger than 6 days exists.
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ISO_NAME}&per_page=1" \
            --jq '[.artifacts[] | select(.expired == false)][0].created_at // empty')
          if [[ -n $latest ]] && (( $(date -u +%s) - $(date -u -d "$latest" +%s) < 6 * 86400 )); then
            echo "A recent installer exists (${latest}); not building another one."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  iso:
    name: Build installer ISO
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Make room on the build machine
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master 2025-10-10

      - name: Find the published image
        id: image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/${owner}/${IMAGE_NAME}"
          repo="${ref#ghcr.io/}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token 2>/dev/null || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" "https://ghcr.io/v2/${repo}/manifests/latest")
          if [[ $code != 200 ]]; then
            echo "::error title=The OS image cannot be downloaded::${ref}:latest is missing or private (HTTP ${code}). First let 'Build OS image' finish successfully; then make the package public: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY_OWNER}?tab=packages → ${IMAGE_NAME} → Package settings → Change visibility → Public. Installed laptops need this to receive updates."
            exit 1
          fi
          sudo podman pull --retry 3 "${ref}:latest"
          digest=$(sudo podman image inspect --format '{{.Digest}}' "${ref}:latest")
          version=$(sudo podman image inspect --format '{{index .Labels "org.opencontainers.image.version"}}' "${ref}:latest")
          { echo "ref=${ref}"; echo "digest=${digest}"; echo "version=${version}"; } | tee -a "$GITHUB_OUTPUT"

      - name: Build the installer's live system
        env:
          REF: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          sudo podman build \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="${REF}@${DIGEST}" \
            --build-arg KRISTALL_IMAGE_REF="${REF}" \
            --build-arg KRISTALL_IMAGE_TAG=latest \
            --build-arg KRISTALL_PAYLOAD_DIGEST="${DIGEST}" \
            --file image/iso/Containerfile \
            --tag localhost/kristall-live:latest .
          df -h /

      # Titanoboa moves the ISO with `realpath` (not -m) to iso-dest: the folder has to exist,
      # otherwise the ISO stays inside the action's checkout and the job fails (run 43990164711).
      - name: Prepare the output folder
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Make the ISO (Titanoboa)
        id: titanoboa
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main 2026-05-19
        with:
          image-ref: localhost/kristall-live:latest
          iso-dest: ${{ github.workspace }}/output/${{ env.ISO_NAME }}

      - name: Check the ISO
        id: check
        env:
          ISO: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          set -euo pipefail
          size=$(stat -c %s "$ISO")
          gib=$(awk -v s="$size" 'BEGIN { printf "%.1f", s / 1073741824 }')
          sha=$(sha256sum "$ISO" | cut -d' ' -f1)
          echo "size_gib=${gib}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "ISO: ${gib} GiB, sha256 ${sha}"
          if (( size > 15 * 1073741824 )); then
            echo "::error::The ISO is ${gib} GiB and would not fit on a 16 GB USB stick."
            exit 1
          fi
          # The ISO must carry Fedora's signed shim so Secure Boot works without changes.
          sudo apt-get install -y -qq xorriso >/dev/null 2>&1 || true
          if command -v osirrox >/dev/null; then
            osirrox -indev "$ISO" -ls /EFI/fedora 2>/dev/null | grep -q shimx64.efi ||
              { echo "::error::shimx64.efi missing from the ISO"; exit 1; }
          fi

      - name: Attach the ISO to this run
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.titanoboa.outputs.iso-dest }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Download link
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          GIB: ${{ steps.check.outputs.size_gib }}
          SHA: ${{ steps.check.outputs.sha256 }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          {
            if [[ $OUTCOME == success ]]; then
              echo "## ⬇️ [Download the Kristall OS installer (${GIB} GB)](${URL})"
              echo
              echo "Kristall OS ${VERSION}. You must be signed in to GitHub to download. The file is the finished ISO (not a zip)."
              echo
              echo "Next: follow the guide **docs/INSTALL.md** in this repository (Deutsch & English) to put it on a USB stick."
              echo
              echo "<sub>SHA-256: \`${SHA}\` · available for 30 days; a new installer is made every Monday.</sub>"
            else
              echo "## ❌ The installer could not be built"
              echo
              echo "Nothing changes for installed laptops. Open the failed step above for the reason (lines marked with a red error)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
