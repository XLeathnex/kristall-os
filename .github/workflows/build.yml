# Builds the Kristall OS image and publishes it to GitHub's container registry (ghcr.io).
# Installed laptops check this registry and update themselves.
#   - every push to main: build + publish
#   - every day: rebuild on the newest base, so Fedora security updates reach the laptop
#   - pull requests: build + test only, nothing is published
name: Build OS image

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail if a component listed in image/components.list is missing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: kristall-os

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Make room on the build machine
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master 2025-10-10

      - name: Prepare
        id: prep
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STRICT: ${{ inputs.strict }}
          STRICT_VAR: ${{ vars.KRISTALL_STRICT }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          fedora=$(sed -n 's/^ARG FEDORA_VERSION=//p' Containerfile)
          date=$(date -u +%Y%m%d)
          version="${fedora}.${date}.${GITHUB_RUN_NUMBER}"
          # Release builds need every component (KRISTALL_STRICT=1). Pull requests may build with
          # gaps; while components are still being written, a maintainer can set the repository
          # variable KRISTALL_STRICT=0 (Settings -> Secrets and variables -> Actions -> Variables).
          strict=1
          if [[ $EVENT == pull_request || $STRICT_VAR == 0 || $INPUT_STRICT == false ]]; then strict=0; fi
          publish=false
          if [[ $EVENT != pull_request && $IS_DEFAULT_BRANCH == true ]]; then publish=true; fi
          {
            echo "image_ref=ghcr.io/${owner}/${IMAGE_NAME}"
            echo "fedora=${fedora}"
            echo "version=${version}"
            echo "strict=${strict}"
            echo "publish=${publish}"
            echo "tags=latest ${fedora} ${version} ${fedora}.${date}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE_REF: ${{ steps.prep.outputs.image_ref }}
          VERSION: ${{ steps.prep.outputs.version }}
          STRICT: ${{ steps.prep.outputs.strict }}
        run: |
          set -euo pipefail
          podman build --pull=newer \
            --build-arg KRISTALL_STRICT="$STRICT" \
            --build-arg KRISTALL_IMAGE_VERSION="$VERSION" \
            --build-arg KRISTALL_IMAGE_REF="$IMAGE_REF" \
            --build-arg KRISTALL_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg KRISTALL_GIT_SHA="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "localhost/${IMAGE_NAME}:build" \
            --file Containerfile .

      - name: Test the built image
        run: |
          set -euo pipefail
          podman run --rm -v "$PWD/image:/k:ro" "localhost/${IMAGE_NAME}:build" bash /k/tests/smoke-image.sh
          podman run --rm "localhost/${IMAGE_NAME}:build" \
            rpm -q kernel-core kwin plasma-workspace plasma-login-manager bootc flatpak

      # Splits the image into many small layers so that an update downloads only what changed
      # (same step as ublue-os/image-template).
      - name: Rechunk for small updates
        run: |
          set -euo pipefail
          GRAPHROOT="$(podman info --format '{{.Store.GraphRoot}}')"
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="localhost/${IMAGE_NAME}:build",target=/rpm-ostree \
            --mount=type=bind,src="${GRAPHROOT}",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            "localhost/${IMAGE_NAME}:build" \
            compose build-chunked-oci \
            --max-layers 127 \
            --format-version=2 \
            --bootc \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/${IMAGE_NAME}:chunked"
          podman images

      - name: Log in to ghcr.io
        if: steps.prep.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        if: steps.prep.outputs.publish == 'true'
        env:
          IMAGE_REF: ${{ steps.prep.outputs.image_ref }}
          TAGS: ${{ steps.prep.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            podman push --retry 3 --digestfile "$RUNNER_TEMP/digest" \
              "localhost/${IMAGE_NAME}:chunked" "${IMAGE_REF}:${tag}"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

      - name: Check that laptops can download the image
        id: public
        if: steps.prep.outputs.publish == 'true'
        env:
          IMAGE_REF: ${{ steps.prep.outputs.image_ref }}
        run: |
          set -uo pipefail
          repo="${IMAGE_REF#ghcr.io/}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token 2>/dev/null || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" "https://ghcr.io/v2/${repo}/manifests/latest")
          if [[ $code == 200 ]]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=One-time step needed::The image is private, so laptops cannot download updates. Open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY_OWNER}?tab=packages, click '${IMAGE_NAME}', then 'Package settings', then 'Change visibility' and choose 'Public'."
          fi

      - name: Sign (optional)
        if: steps.prep.outputs.publish == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE_REF: ${{ steps.prep.outputs.image_ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          chmod +x "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}@${DIGEST}"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          PUBLISH: ${{ steps.prep.outputs.publish }}
          PUBLIC: ${{ steps.public.outputs.public }}
          IMAGE_REF: ${{ steps.prep.outputs.image_ref }}
          VERSION: ${{ steps.prep.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            if [[ $OUTCOME == success && $PUBLISH == true ]]; then
              echo "## ✅ Kristall OS ${VERSION} is published"
              echo
              echo "Installed laptops will download it in the background and use it after their next restart."
              echo
              echo "\`${IMAGE_REF}:latest\` — digest \`${DIGEST}\`"
              if [[ $PUBLIC != true ]]; then
                echo
                echo "### ⚠️ One-time step: make the image public"
                echo "Laptops can only download public images. Open **Your profile → Packages → ${IMAGE_NAME} → Package settings → Change visibility → Public**."
              fi
            elif [[ $OUTCOME == success ]]; then
              echo "## ✅ Kristall OS builds and passes its tests (not published: pull request or not the main branch)"
            else
              echo "## ❌ The Kristall OS image could not be built"
              echo
              echo "Nothing was published. **Installed laptops keep the last good version** and are not affected."
              echo "Open the failed step above; lines marked with a red error explain what went wrong."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
