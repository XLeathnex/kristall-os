# Kristall global menus, app side (kwin/bridge README "Global menus"), installed as
# /usr/lib/environment.d/50-kristall-appmenu.conf:
# * Qt: the "kristall" platform theme is KDE's theme plus a guard that shows an app's own menu bar
#   while no Kristall menu bar displays app menus. Without the plugin (Flatpak apps) Qt falls back
#   to its usual theme list.
# * GTK 3 on Wayland: kristall-appmenu-gtk-module exports GtkMenuBar menus to the menu bar
#   (KWin's app-menu protocol) and hides the in-window bar while the menu bar shows them.
QT_QPA_PLATFORMTHEME=kristall
GTK_MODULES=${GTK_MODULES:+$GTK_MODULES:}kristall-appmenu-gtk-module
