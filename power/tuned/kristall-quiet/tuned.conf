# Kristall OS power mode: Leise (Quiet) on mains. Values: docs/contracts/power.md §4 (checked against policy.py by power/tests).
# Package power limits are not set here: the [script] hook computes them relative to the
# firmware's own values (kristall-power tuned-hook), after the platform profile is applied.

[main]
summary=Kristall OS: Leise (Quiet) on mains
include=kristall-common

[cpu]
energy_performance_preference=balance_power
energy_perf_bias=balance-power

[acpi]
platform_profile=quiet|low-power|balanced

[script]
# Runs after every other unit (priority) so the firmware has seen the platform profile.
priority=100
script=${i:PROFILE_DIR}/script.sh
