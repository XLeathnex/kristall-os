# SPDX-License-Identifier: GPL-3.0-or-later
# Kristall OS: settings shared by every Kristall power mode. Included by the six mode profiles
# (kristall-{quiet,balanced,performance}[-battery]); never activated on its own.
# Numbers and reasoning: docs/contracts/power.md §4. Keep in sync with power/lib/kristall_power/policy.py
# (power/tests checks it).

[main]
summary=Kristall OS common power settings (not for direct use)

[cpu]
# intel_pstate (active, HWP) offers only performance|powersave; "powersave" + EPP is the right
# pair there. With intel_cpufreq/acpi-cpufreq, schedutil is the sane choice. Never "performance":
# on HWP it pins the minimum frequency to the maximum (hot at idle).
governor=schedutil|powersave
# Turbo stays on in every mode: short bursts are what make the machine feel instant.
boost=1

[audio]
# Power down the HD-Audio codec after 10 s of silence (same as Fedora's stock tuned "balanced").
timeout=10

[sysctl]
# The NMI watchdog keeps a perf counter interrupt firing on every CPU; it only helps kernel
# developers debug hard lockups. Off saves idle wake-ups (powertop's classic tunable).
kernel.nmi_watchdog=0
