# Kristall OS (power component): automatic background work runs in kristall-background.slice
# (efficiency cores on hybrid CPUs, low CPU share), so it never spins the fans up on the
# performance cores while the owner works. Contract: docs/contracts/power.md §5.
[Service]
Slice=kristall-background.slice
