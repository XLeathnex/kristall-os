# Kristall OS (power component): tuned-ppd mapping of the three owner-facing modes.
#   power-saver = Leise, balanced = Ausgewogen, performance = Leistung
# tuned-ppd picks the [battery] variant by itself whenever UPower reports OnBattery, so each mode
# has a mains and a battery meaning without anyone switching modes. Contract: docs/contracts/power.md

[main]
default=balanced
battery_detection=true
# Fn-key profile changes (e.g. ThinkPad Fn+L/M/H) become the owner's manual choice.
sysfs_acpi_monitor=true

[profiles]
power-saver=kristall-quiet
balanced=kristall-balanced
performance=kristall-performance

[battery]
power-saver=kristall-quiet-battery
balanced=kristall-balanced-battery
performance=kristall-performance-battery
