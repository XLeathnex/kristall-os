# Kristall OS (power component): memory settings for 16 GB RAM with compressed swap in RAM (zram).
# Swapping to zram costs a little CPU instead of disk I/O, so the kernel should prefer it over
# dropping file cache: swappiness above 100 is the documented range for in-memory swap
# (Documentation/admin-guide/sysctl/vm.rst). page-cluster 0: zram has no seek cost, no readahead.
vm.swappiness = 180
vm.page-cluster = 0
# No watermark boosting: it causes bursts of reclaim (and CPU wake-ups) after fragmentation events.
vm.watermark_boost_factor = 0
