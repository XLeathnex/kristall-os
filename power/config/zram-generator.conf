# Kristall OS (power component): drop-in for the base's zram-generator configuration.
# A zram device as large as RAM (uncompressed size; typically 2-3x compression, so at most about
# 6-8 GB of real memory when completely full). Gives Blender scenes room before anything is killed.
[zram0]
zram-size = ram
