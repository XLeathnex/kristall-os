; Kristall OS (power component): GameMode administrator config (/etc/gamemode.ini).
; GameMode is how games ask for full power. Kristall's session daemon sees each registered game
; on D-Bus and holds the "performance" power profile while one runs on mains (contract
; docs/contracts/power.md §3). GameMode itself must therefore NOT change CPU governors or the
; platform profile, which would fight tuned: the governor it writes is the one tuned already uses
; (intel_pstate "powersave" = HWP + EPP; writing the same policy leaves EPP untouched).
[general]
; check for vanished clients every 30 s instead of 5 s (fewer wake-ups; GameMode 1.8 has no
; event-driven alternative)
reaper_freq=30
desiredgov=powersave
defaultgov=powersave
igpu_desiredgov=powersave
; -1 disables the iGPU energy sampling (a RAPL read every reaper cycle)
igpu_power_threshold=-1
softrealtime=off
renice=0
ioprio=0
inhibit_screensaver=1
; split-lock mitigation slows some Windows games under Proton by orders of magnitude; GameMode
; turns it off only while a game runs and restores it afterwards
disable_splitlock=1

[cpu]
; the kernel (ITMT) already prefers the fast P-cores; pinning would fight shader-compile threads
park_cores=no
pin_cores=no
